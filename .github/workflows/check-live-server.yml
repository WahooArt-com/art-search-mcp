name: Check the live server

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover tests
      - name: Python example
        working-directory: examples/python
        run: |
          pip install -r requirements.txt
          python find_and_price_an_artwork.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript example
        working-directory: examples/javascript
        run: |
          npm install
          node find_and_price_an_artwork.mjs
